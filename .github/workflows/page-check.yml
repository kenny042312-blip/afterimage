name: Page check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: page-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-pages:
    name: Check pages in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.64.0

      - name: Install headless Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Check every HTML page
        run: node .github/scripts/page-check.mjs
        env:
          PAGE_CHECK_OUTPUT: page-check-results
          CHECK_FILE_URL: 'true'

      - name: Upload page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-check-screenshots
          path: page-check-results/
          if-no-files-found: warn
          retention-days: 7
